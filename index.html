  (function() {
    var cdns = [
      'vendor/dexie.min.js',
      'https://cdn.jsdelivr.net/npm/dexie@4.4.3/dist/dexie.min.js',
      'https://unpkg.com/dexie@4.4.3/dist/dexie.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/dexie/4.4.3/dexie.min.js'
    ]
    var loaded = false
    function tryLoad(i) {
      if (i >= cdns.length || loaded) return
      var s = document.createElement('script')
      s.src = cdns[i]
      s.onload = function() { loaded = true }
      s.onerror = function() { tryLoad(i + 1) }
      document.head.appendChild(s)
    }
    tryLoad(0)
  })()
  </script>

  <!-- 访问口令校验（站点公开部署时的轻量门槛） -->
  <script>
  (function () {
    var WANWAN_ACCESS_PIN = 'wanwan';   // 改成你自己的口令；设为 '' 即关闭访问口令
    var STORE_KEY = 'wanwan-access-pass';
    if (!WANWAN_ACCESS_PIN) return;
    try { if (localStorage.getItem(STORE_KEY) === WANWAN_ACCESS_PIN) return; } catch (e) {}

    function showGate() {
      var gate = document.createElement('div');
      gate.id = 'ww-access-gate';
      gate.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px;';
      gate.innerHTML =
        '<div style="font-size:24px;font-weight:600;color:#111;letter-spacing:2px;">弯弯</div>' +
        '<div style="font-size:13px;color:#999;margin:10px 0 22px;">个人部署实例，请输入访问口令</div>' +
        '<input id="ww-pin-input" type="password" autocomplete="off" placeholder="访问口令" ' +
        'style="width:220px;padding:12px 14px;border:1px solid #e5e5e5;border-radius:12px;font-size:16px;text-align:center;outline:none;box-sizing:border-box;">' +
        '<button id="ww-pin-btn" style="width:220px;margin-top:12px;padding:12px 14px;border:none;border-radius:12px;background:#111;color:#fff;font-size:15px;box-sizing:border-box;">进入</button>' +
        '<div id="ww-pin-err" style="height:18px;margin-top:10px;font-size:12px;color:#d33;"></div>';
      document.body.appendChild(gate);

      var input = gate.querySelector('#ww-pin-input');
      var btn = gate.querySelector('#ww-pin-btn');
      var err = gate.querySelector('#ww-pin-err');

      function submit() {
        if (input.value.trim() === WANWAN_ACCESS_PIN) {
          try { localStorage.setItem(STORE_KEY, WANWAN_ACCESS_PIN); } catch (e) {}
          gate.remove();
        } else {
          err.textContent = '口令不正确';
          input.value = '';
          input.focus();
        }
      }
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 300);
    }

    if (document.body) showGate();
    else document.addEventListener('DOMContentLoaded', showGate);
  })();
  </script>

  <!-- 移除托管平台注入的推广浮层（Netlify HUD 的 nl-badge-frame） -->
  <script>
  (function () {
    function dropHud() {
      var f = document.getElementById('nl-badge-frame');
      if (f && f.parentNode) f.parentNode.removeChild(f)
    }
    var mo = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var added = muts[i].addedNodes
        for (var j = 0; j < added.length; j++) {
          var n = added[j]
          if (n && n.nodeType === 1 && n.tagName === 'IFRAME' && n.id === 'nl-badge-frame') {
            n.parentNode && n.parentNode.removeChild(n)
          }
        }
      }
    })
    if (document.documentElement) {
      mo.observe(document.documentElement, { childList: true, subtree: true })
    }
    document.addEventListener('DOMContentLoaded', dropHud)
    window.addEventListener('load', dropHud)
    var timer = setInterval(dropHud, 600)
    setTimeout(function () { clearInterval(timer) }, 15000)
  })()
  </script>
